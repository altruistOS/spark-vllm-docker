# Recipe: DeepSeek-V4-Flash-0731
#
# Strictly follows the DSpark advanced repo (DeepSeek-v4-Flash-DSpark-2x-DGX-Spark)
# docker-compose.dspark.yml env surface, adapted for eugr's launch-cluster.sh.
#
# Prerequisites (do once on ALL nodes):
#   docker pull ghcr.io/anemll/dspark-vllm-gx10:0.1.1
#   huggingface-cli download deepseek-ai/DeepSeek-V4-Flash-0731
#
# IMPORTANT: HF_HOME caveat
# eugr mounts host $HF_CACHE_DIR to /root/.cache/huggingface inside the container.
# This env var tells the Anemll image to use that mount point instead of its
# default /cache/huggingface. Inside the container /root/ is root-writable.
#
# Usage:
#   ./run-recipe.sh deepseek-v4-flash-dspark-0731 --no-ray --port 8888

recipe_version: "1"
name: DeepSeek-V4-Flash-DSpark-0731
description: DeepSeek V4 Flash DSpark with NVFP4 DS-MLA KV on 2x DGX Spark

model: deepseek-ai/DeepSeek-V4-Flash-0731
container: ghcr.io/anemll/dspark-vllm-gx10:0.1.1
cluster_only: true
mods:
  - mods/drop-caches

defaults:
  port: 8888
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.80
  max_model_len: 1048576
  max_num_seqs: 6
  max_num_batched_tokens: 8192
  mtp_num_tokens: 5
  cudagraph_capture_size: 36
  served_model_name: deepseek-v4-flash-0731

env:
  # Path: match eugr's default mount ($HF_CACHE_DIR -> /root/.cache/huggingface)
  HF_HOME: "/root/.cache/huggingface"
  # Offline: model weights pre-downloaded; no online fetch at runtime
  HF_HUB_OFFLINE: "1"
  # Runtime: important for GPU kernel dispatch (from DSpark compose)
  VLLM_USE_FLASHINFER_SAMPLER: "1"
  VLLM_USE_B12X_MOE: "1"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  # GPU memory: enables expandable segments for better fragmentation handling
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "0"

command: |
  vllm serve deepseek-ai/DeepSeek-V4-Flash-0731 \
    --served-model-name {served_model_name} \
    --trust-remote-code \
    --port {port} \
    --host {host} \
    --tensor-parallel-size {tensor_parallel} \
    --pipeline-parallel-size 1 \
    --kv-cache-dtype nvfp4_ds_mla \
    --block-size 256 \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --max-cudagraph-capture-size {cudagraph_capture_size} \
    --enable-prefix-caching \
    --enable-chunked-prefill \
    --async-scheduling \
    --speculative-config '{{"method":"dspark","num_speculative_tokens":{mtp_num_tokens},"draft_sample_method":"probabilistic"}}' \
    --distributed-executor-backend mp \
    --moe-backend flashinfer_b12x \
    --attention-backend flashinfer \
    --enable-flashinfer-autotune \
    --tool-call-parser deepseek_v4 \
    --enable-auto-tool-choice \
    --tokenizer-mode deepseek_v4 \
    --reasoning-parser deepseek_v4 \
    --reasoning-config '{{"reasoning_parser":"deepseek_v4","reasoning_start_str":" thinking","reasoning_end_str":" response"}}' \
    --default-chat-template-kwargs '{{"thinking":false}}' \
    --generation-config vllm
