# Recipe: DeepSeek V4 Flash Vision Exp (vLLM 0.29 B12X, Dickson/PILCOTHINK stack)
#
# Port of the 0rand / Dickson "vllm_spark_dsv4:0.29-b12x" serving config
# (DeepSeek-V4-flash-ver-2sparks-vllm-029-0rand) into a run-recipe.sh recipe.
# The 0.29 B12X image (dicksondickson/vllm_spark_dsv4:0.29-b12x) integrates
# native vision + DSpark upstream: NO vision-injection mod needed (unlike the
# Anemll 0.28.1rc vision-dspark recipe).
#
# Deploy:
#   ./run-recipe.sh deepseek-v4-flash-vision-exp-0rand --no-ray --port 8888 -d
#
# NOTE (0rand .env specials that a recipe must carry explicitly):
#   1. The 0.29 image preflight REQUIRES VLLM_USE_AOT_COMPILE=0 and
#      VLLM_USE_BREAKABLE_CUDAGRAPH=1 (per 0rand README "do NOT regress").
#      (eugr official vision-exp recipe uses the reverse: AOT=1/BREAKABLE=0.)
#   2. HF_HOME: 0rand forces a COMPLETE hub tree via HF_CACHE_DIR, because
#      ~/.cache/huggingface may hold a root-owned PARTIAL decoy that hangs the
#      loader. Set HF_CACHE_DIR if you use a dedicated cache tree.
#   3. Images only in USER messages (DeepSeek contract); --skip-mm-profiling is
#      required to keep boot RAM sane.
#   4. Optional bugfix mod mods/fix-dsv4-mm-prefix-span is NOT listed here
#      (default OFF, matching 0rand FIX_MM_PREFIX_SPAN=0). Enable on demand:
#        ./run-recipe.sh deepseek-v4-flash-vision-exp-0rand ... \
#            --apply-mod mods/fix-dsv4-mm-prefix-span
#
# This recipe is intentionally faithful to 0rand's .env.sample defaults.

recipe_version: "1"
name: DeepSeek-V4-Flash-Vision-Exp-0rand-B12X
description: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp on 2x DGX Spark via the 0.29 B12X (Dickson/PILCOTHINK) image

model: deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
container: dicksondickson/vllm_spark_dsv4:0.29-b12x
cluster_only: true

# Intentionally empty: native-vision 0.29 image needs no vision mod.
mods: []

defaults:
  port: 8888
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.87
  max_model_len: 1048576
  block_size: 256
  max_num_seqs: 4
  max_num_batched_tokens: 4096
  max_cudagraph_capture_size: 48
  num_speculative_tokens: 6
  served_model_name: deepseek-v4-flash

env:
  # --- 0.29 B12X image preflight requirements (0rand README; do NOT regress) ---
  VLLM_USE_AOT_COMPILE: "0"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
  # --- Offline HF (DGX has no HF internet). Without HF_HUB_OFFLINE the 0.29
  #     image tries to reach huggingface.co during model load and fails with
  #     "repo_utils.py Error retrieving file list: Network is unreachable"
  #     (observed 2026-09-13). These force a local-cache offline load, same as
  #     the vision-dspark recipe. ---
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  HF_HOME: "/root/.cache/huggingface"
  # --- 0rand .env special: route HF cache to a complete hub tree if needed ---
  # HF_CACHE_DIR: "/root/models/deepseek-ai"  # override to a complete tree

command: |
  vllm serve deepseek-ai/DeepSeek-V4-Flash-Vision-Exp \
    --host {host} \
    --port {port} \
    --served-model-name {served_model_name} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --kv-cache-dtype fp8 \
    --block-size {block_size} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --enable-prefix-caching \
    --async-scheduling \
    --enable-chunked-prefill \
    --skip-mm-profiling \
    --limit-mm-per-prompt '{{"image":8}}' \
    --tokenizer-mode deepseek_v4 \
    --tool-call-parser deepseek_v4 \
    --enable-auto-tool-choice \
    --reasoning-parser deepseek_v4 \
    --reasoning-config '{{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}}' \
    --default-chat-template-kwargs '{{"thinking":true,"reasoning_effort":"max"}}' \
    --moe-backend b12x \
    --linear-backend b12x \
    --attention-backend FLASHINFER_MLA_SPARSE_DSV4 \
    --max-cudagraph-capture-size {max_cudagraph_capture_size} \
    --compilation-config '{{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}}' \
    --speculative-config '{{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic","attention_backend":"FLASHINFER_MLA_SPARSE_DSV4","enable_adaptive_verification":false}}'
