# Recipe: Laguna S 2.1-FP8
# Laguna S 2.1-FP8 with dflash experimental SM120 support

recipe_version: "1"
name: Laguna-S-2.1-FP8
description: vLLM serving Laguna-S-2.1-FP8 on a DGX Spark cluster

# HuggingFace model to download (optional, for --download-model)
model: poolside/Laguna-S-2.1-FP8

# Container image to use
container: vllm-node-laguna

# Can only be run in a cluster
cluster_only: true

# No mods required
mods: 
  - mods/drop-caches

# Default settings (can be overridden via CLI where supported)
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: 262144
  block_size: 256
  max_num_seqs: 4
  max_num_batched_tokens: 8192
  num_speculative_tokens: 2
#  kv_cache_memory_bytes: 5368709120

# Environment variables
env:
# DG_JIT_USE_NVRTC: "0"
# VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
# VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
  RAY_memory_monitor_refresh_ms: "0"
  VLLM_BLOCKSCALE_FP8_GEMM_FLASHINFER: "0"

# The vLLM serve command template
command: |
  vllm serve poolside/Laguna-S-2.1-FP8 \
      --host {host} \
      --port {port} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --kv-cache-dtype fp8 \
      --block-size {block_size} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --enforce-eager \
      --speculative-config '{{"model":"poolside/Laguna-S-2.1-DFlash-FP8","num_speculative_tokens":6,"method":"dflash"}}' \
      --moe-backend triton \
      --distributed-executor-backend ray \
      --enable-auto-tool-choice \
      --tool-call-parser poolside_v1 \
      --reasoning-parser poolside_v1 \
      --default-chat-template-kwargs.thinking=true \
      --default-chat-template-kwargs.reasoning_effort=high \
      --load-format instanttensor
